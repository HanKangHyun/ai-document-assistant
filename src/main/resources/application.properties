spring.application.name=ai-document-assistant
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.address=127.0.0.1
spring.profiles.default=local
spring.sql.init.mode=always
app.upload-dir=${UPLOAD_DIR:uploads}
server.error.include-message=never
app.ai.enabled=${AI_ENABLED:false}
app.ai.model=${OLLAMA_MODEL:}
app.ai.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
app.ai.timeout-seconds=60
app.search.semantic-enabled=${SEMANTIC_ENABLED:false}
app.search.min-similarity=${SEMANTIC_MIN_SIMILARITY:0.35}
